# Bundled wallet-api uses an embedded SQLite file so the real walt.id stack is
# self-contained (no extra Postgres container needed). The DB lives on the
# mounted ./wallet-api/data volume. Swap in a Postgres dataSource block for a
# production deployment.
dataSource {
    jdbcUrl = "jdbc:sqlite:/waltid-wallet-api/data/wallet.db"
    driverClassName = "org.sqlite.JDBC"
    username = ""
    password = ""
    transactionIsolation = "TRANSACTION_SERIALIZABLE"

    maximumPoolSize = 5
    autoCommit = false
    dataSource {
        journalMode = WAL
        fullColumnNames = false
    }
}
recreateDatabaseOnStart = false
