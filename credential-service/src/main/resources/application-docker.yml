spring:
  kafka:
    bootstrap-servers: kafka:9092
    properties:
      key:
        serializer: org.apache.kafka.common.serialization.StringSerializer
      value:
        serializer: org.apache.kafka.common.serialization.StringSerializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      max-request-size: 10485760
      buffer-memory: 33554432
      compression-type: snappy
      batch-size: 16384
      linger-ms: 1
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: credential-service-group
      max-poll-records: 500
      fetch-max-bytes: 10485760
      max-partition-fetch-bytes: 10485760
      properties:
        spring.json.trusted.packages: "pt.ulusofona.ulht.credential,java.util,java.lang"
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      poll-timeout: 3000
  application:
    name: credential-service
    version: 1.0.0
  main:
    allow-bean-definition-overriding: true
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        service-name: credential-service
        instance-id: ${spring.application.name}-${random.uuid}
        health-check-path: /api/v1/actuator/health
        health-check-interval: 10s
    openfeign:
      client:
        config:
          waltidCredentialClient:
            url: https://issuer.demo.walt.id/openid4vc/jwt
          waltidIssuerClient:
            url: http://issuer-api:7002/onboard
          waltidWalletClient:
            url: http://wallet-api:7001
          waltidVerifierClient:
            url: http://verifier-api:7003

# WaltID Configuration for Docker
waltid:
  issuer:
    url: http://issuer-api:7002
  wallet:
    url: http://wallet-api:7001
  verifier:
    url: http://verifier-api:7003

# Logging for Docker environment
logging:
  level:
    pt.ulusofona.ulht.credential: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
  # Security configuration for sensitive data masking
  security:
    enabled: true
    sensitive-fields:
      - password
      - passwd
      - pwd
      - secret
      - token
      - key
      - apiKey
      - api_key
      - authorization
      - auth
      - credential
      - credentials
      - privateKey
      - private_key
      - sessionToken
      - session_token
      - accessToken
      - access_token
      - refreshToken
      - refresh_token
      - jwt
      - bearer
      - apikey
      - apisecret
      - clientSecret
      - client_secret
    mask-string: "###"
    mask-request-body: true
    mask-response-body: true
    mask-headers: true
    sensitive-headers:
      - authorization
      - x-api-key
      - x-auth-token
      - cookie
      - set-cookie

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        # health/info/prometheus are public (permitAll in SecurityConfig); all
        # business endpoints require the apikey header.
        include: health,info,prometheus
      # Default base-path so the actuator sits at <context-path>/actuator/**,
      # i.e. /api/v1/actuator/** — consistent with the other services, the
      # compose healthchecks, and the Prometheus scrape path.
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version} 