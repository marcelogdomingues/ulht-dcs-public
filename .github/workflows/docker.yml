# -----------------------------------------------------------------------------
# Docker Build
# -----------------------------------------------------------------------------
# Two responsibilities:
#   1. compose-validate: statically validate the Compose files parse and render.
#   2. images: build a container image per service from its multi-stage
#      Dockerfile. On non-PR events (push to default branch, or a v* tag) the
#      images are ALSO pushed to the GitHub Container Registry (GHCR).
#
# NOTE: pushing to GHCR uses the built-in GITHUB_TOKEN. The repository /
# organisation must allow GitHub Actions to write packages (Settings ->
# Actions -> Workflow permissions, or package visibility). On pull requests we
# never push — we only verify that the image builds.
# -----------------------------------------------------------------------------
name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "dcs-commons/**"
      - "credential-service/**"
      - "student-service/**"
      - "sis-service/**"
      - "fulfilment-service/**"
      - "**/Dockerfile"
      - "docker-compose.*.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "dcs-commons/**"
      - "credential-service/**"
      - "student-service/**"
      - "sis-service/**"
      - "fulfilment-service/**"
      - "**/Dockerfile"
      - "docker-compose.*.yml"
      - ".github/workflows/docker.yml"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Validate that the Compose files parse and fully render. The override file
  # and .env are git-ignored, so we export the required variables inline with
  # dummy values just for validation.
  # ---------------------------------------------------------------------------
  compose-validate:
    name: Validate Compose files
    runs-on: ubuntu-latest
    env:
      APP_API_KEY: dummy-api-key
      WALLET_PASSWORD_SECRET: dummy-secret
      WALLET_PASSWORD_SALT: dummy-salt
      GRAFANA_ADMIN_PASSWORD: dummy-grafana-pass
      KAFKA_UI_PASSWORD: dummy-kafka-pass
      POSTGRES_PASSWORD: dummy-pg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate microservices compose
        run: docker compose -f docker-compose.microservices.yml config

      - name: Validate infrastructure compose
        run: docker compose -f docker-compose.infrastructure.yml config

  # ---------------------------------------------------------------------------
  # Build (and optionally push) one image per service.
  # ---------------------------------------------------------------------------
  images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so GITHUB_TOKEN can push images to GHCR.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - credential-service
          - student-service
          - sis-service
          - fulfilment-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GHCR only on non-PR events (push/tag). PRs never push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Build context is the REPOSITORY ROOT so the shared dcs-commons module
          # is available to the service Dockerfile (which installs it first).
          context: .
          file: ${{ matrix.service }}/Dockerfile
          # Build-only in CI: this verifies every service image builds on each
          # push/PR. Publishing to GHCR is done from the release workflow (or
          # manually) because GHCR package writes require the package to exist
          # and be linked with write access, which is a one-time repo/account
          # setup step rather than something CI should own.
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/dcs-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dcs-${{ matrix.service }}:latest
          # Use the GitHub Actions cache to speed up rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
