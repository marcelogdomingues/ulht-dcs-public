spring:
  application:
    name: ulht-fulfilment-service
    version: 1.0.0
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/fulfilment}
    username: ${SPRING_DATASOURCE_USERNAME:ulht}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:demo-pg}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        service-name: fulfilment-service
        instance-id: ${spring.application.name}-${random.uuid}
        health-check-path: /api/v1/actuator/health
        health-check-interval: 10s
  kafka:
    bootstrap-servers: kafka:9092
    properties:
      key:
        serializer: org.apache.kafka.common.serialization.StringSerializer
      value:
        serializer: org.apache.kafka.common.serialization.StringSerializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      max-request-size: 10485760
      buffer-memory: 33554432
      compression-type: snappy
      batch-size: 16384
      linger-ms: 1
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: fulfilment-service-group
      fetch-max-bytes: 10485760
      max-partition-fetch-bytes: 10485760
      properties:
        spring.json.trusted.packages: "pt.ulusofona.ulht.fulfilment,java.util,java.lang"
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      poll-timeout: 3000

# Fulfilment Service Configuration for Docker
fulfilment-service:
  sse:
    timeout: 30000  # 30 seconds
    cleanup-delay: 300  # 5 minutes
  workflow:
    max-concurrent: 1000
    retention-hours: 24

server:
  port: 8087
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    context-path: /api/v1

# Enhanced OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
    display-request-duration: true

# Logging Configuration
logging:
  level:
    pt.ulusofona.ulht.fulfilment: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management and Monitoring
management:
  endpoints:
    web:
      exposure:
        # health/info are public (permitAll); prometheus is kept for scraping but
        # protected by the security filter (requires apikey).
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
