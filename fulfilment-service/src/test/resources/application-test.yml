spring:
  datasource:
    url: jdbc:h2:mem:fulfilment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: fulfilment-service-test
    producer:
      acks: all
      retries: 3
  application:
    name: fulfilment-service-test

logging:
  level:
    pt.ulusofona: DEBUG
    org.apache.kafka: WARN

